// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        compileSdkVersion = 36
        minSdkVersion = 29
        targetSdkVersion = 36
        libraryVersionName = "1.1.3"
        libraryVersionCode = 010103
        appVersionName = "26.17.0"
        appVersionCode = {
            return generateVersionCodeForBuild()
        }
    }


    dependencies {
        classpath libs.gradle
        classpath libs.google.services
        classpath libs.hilt.android.gradle.plugin
        classpath libs.org.jacoco.core
        classpath libs.firebase.crashlytics.gradle
        classpath libs.perf.plugin
    }
}

plugins {
    alias(libs.plugins.detekt) apply true
    alias(libs.plugins.google.devtools.ksp) apply false
    alias(libs.plugins.jmailen.kotlinter)
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.kotlin.plugin.serialization)
    alias(libs.plugins.baselineprofile) apply false
    alias(libs.plugins.gradle.test.retry) apply false
}

apply from: 'git-hooks/githooks.gradle'

dependencies {
    detektPlugins project(':detekt-rules')
}

gradle.projectsEvaluated {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xmaxerrs" << "1000"
    }
}

static def generateVersionCodeForBuild() {
    //If on Jenkins, get VERSION_CODE which is set in jenkins job/pipeline
    // VERSION_CODE= YYMMdd + BUILD_NUMBER
    if (System.getenv("VERSION_CODE") != null) {
        return System.getenv("VERSION_CODE") as Integer
    }
    //Fallback if VERSION_CODE is not set in jenkins job
    else if(System.getenv("BUILD_NUMBER") != null) {
        return System.getenv("BUILD_NUMBER") as Integer
    }
    //Else local [Update with every release]
    return 9748402
}