version: 2
updates:
  # Verify Gradle dependencies
  - package-ecosystem: "gradle"
    directories:
      - "/android/main"
      - "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "com.wbd.*:*"
      - dependency-name: "com.turner.*:*"
      - dependency-name: "com.mapbox.*:*"
    reviewers:
      - "turnercode/cnn-android"
    groups:
      production-version-updates:
        dependency-type: "production"
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      production-security-updates:
        dependency-type: "production"
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Verify Github Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    reviewers:
      - "turnercode/cnn-android"
